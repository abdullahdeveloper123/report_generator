<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Report Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <h1>Daily Report Generator</h1>
      </div>
      <button id="historyBtn" class="btn btn-secondary">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        History
      </button>
    </div>

    <div id="mainView">
      <div class="grid">
        <div class="card">
          <h2>Create Report</h2>

          <div class="form-group">
            <label>Report Title</label>
            <input type="text" id="reportTitle" placeholder="e.g., Daily Tasks - January 3, 2026">
          </div>

          <div class="form-group">
            <label>Tasks Completed Today</label>
            <div id="tasksList" class="tasks-list"></div>
          </div>

          <div class="button-group">
            <button id="addTaskBtn" class="btn btn-secondary">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
              Add Task
            </button>
            <button id="generateBtn" class="btn btn-primary" style="flex: 1;">Generate Report</button>
            <button id="newReportBtn" class="btn btn-success" style="display: none;">New Report</button>
          </div>
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="margin: 0;">Generated Report</h2>
            <div id="reportActions" style="display: none; gap: 8px;">
              <button id="copyBtn" class="btn btn-secondary btn-small">Copy</button>
              <button id="downloadPdfBtn" class="btn btn-success btn-small">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                PDF
              </button>
            </div>
          </div>

          <div id="reportPreview">
            <div class="empty-state">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              <p>Your generated report will appear here</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="historyView" class="history-view card">
      <div class="history-header">
        <h2 style="margin: 0;">Report History</h2>
        <button id="backBtn" class="btn btn-primary">Back to Generator</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>
  <footer style="position: fixed;bottom: 0px; width: 100%; left: 0px;">
    <p style="padding: 10px 0; color: white; text-align: center; background-color: rgb(59, 59, 59);">Made By Abdullah
      Hussain with 💗</p>
  </footer>
  <script src="js/main.js"></script>
</body>

</html>
